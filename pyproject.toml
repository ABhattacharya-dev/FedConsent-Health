[project]
name = "fedconsent-health"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch", "torchvision", "medmnist", "flwr", "opacus", "scikit-learn",
  "fastapi", "uvicorn", "sqlalchemy", "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
