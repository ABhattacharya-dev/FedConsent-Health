<svg xmlns="http://www.w3.org/2000/svg" viewBox="295 75 434 420" width="434" height="420" role="img" aria-label="FedConsent Health icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Segment gradients (user-space so color flows along each piece) -->
    <linearGradient id="gBlueTop" gradientUnits="userSpaceOnUse" x1="362" y1="175" x2="512" y2="125">
      <stop offset="0" stop-color="#5C9BFF"/><stop offset="1" stop-color="#3F68D6"/>
    </linearGradient>
    <linearGradient id="gRedTop" gradientUnits="userSpaceOnUse" x1="512" y1="125" x2="658" y2="171">
      <stop offset="0" stop-color="#D2423C"/><stop offset="1" stop-color="#F4604F"/>
    </linearGradient>
    <linearGradient id="gGreen" gradientUnits="userSpaceOnUse" x1="362" y1="175" x2="512" y2="432">
      <stop offset="0" stop-color="#4FC672"/><stop offset="0.55" stop-color="#34A853"/><stop offset="1" stop-color="#1F8A3C"/>
    </linearGradient>
    <linearGradient id="gYellow" gradientUnits="userSpaceOnUse" x1="656" y1="196" x2="530" y2="428">
      <stop offset="0" stop-color="#FFD54A"/><stop offset="1" stop-color="#F7A21B"/>
    </linearGradient>
    <linearGradient id="gCross" gradientUnits="userSpaceOnUse" x1="437" y1="204" x2="587" y2="356">
      <stop offset="0" stop-color="#FDC72E"/><stop offset="0.5" stop-color="#F7A41C"/><stop offset="1" stop-color="#EA4335"/>
    </linearGradient>

    <!-- Node gradients -->
    <radialGradient id="nBlue" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#6AA6FF"/><stop offset="1" stop-color="#2E6BE0"/>
    </radialGradient>
    <radialGradient id="nRed" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FF7A6B"/><stop offset="1" stop-color="#DB372B"/>
    </radialGradient>
    <radialGradient id="nGreen" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#52C874"/><stop offset="1" stop-color="#1F8A3C"/>
    </radialGradient>
    <radialGradient id="nPurple" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7B63B8"/><stop offset="1" stop-color="#4E3F8E"/>
    </radialGradient>
    <radialGradient id="nYellow" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFE066"/><stop offset="1" stop-color="#F9A825"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="5" stdDeviation="3.5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Shield outline: segments meet exactly at shared points; flat cap at the blue/green joint -->
    <g fill="none" stroke-width="44" stroke-linejoin="round">
      <path d="M362 175 C420 168 468 150 512 125" stroke="url(#gBlueTop)" stroke-linecap="round"/>
      <path d="M512 125 C560 152 610 168 658 171" stroke="url(#gRedTop)" stroke-linecap="round"/>
      <path d="M362 175 C366 225 376 280 388 322 C400 365 452 412 512 432" stroke="url(#gGreen)" stroke-linecap="round"/>
      <path d="M658 171 C656 245 650 290 636 328 C618 378 580 410 512 432" stroke="url(#gYellow)" stroke-linecap="round"/>
    </g>

    <!-- Corner nodes: inner circles are concentric with outer ones -->
    <circle cx="362" cy="175" r="38" fill="url(#nBlue)"/>
    <circle cx="362" cy="175" r="22" fill="#1A56DB" opacity="0.55"/>

    <circle cx="658" cy="171" r="38" fill="url(#nRed)"/>
    <circle cx="658" cy="171" r="22" fill="#C5221F" opacity="0.55"/>

    <!-- Top join -->
    <circle cx="512" cy="125" r="21" fill="url(#nPurple)" opacity="0.92"/>

    <!-- Bottom node -->
    <circle cx="512" cy="432" r="40" fill="url(#nGreen)"/>
    <circle cx="512" cy="432" r="30" fill="#1B6E32" opacity="0.6"/>
    <circle cx="512" cy="432" r="16" fill="url(#nYellow)"/>

    <!-- Medical cross (one shared gradient across both bars) -->
    <g fill="url(#gCross)">
      <rect x="486" y="204" width="52" height="152" rx="12"/>
      <rect x="437" y="254" width="150" height="52" rx="12"/>
    </g>
  </g>
</svg>
